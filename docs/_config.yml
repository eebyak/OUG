title: Open University of Germany
description: >-
  A prospective, presently fictive public university designed from first
  principles — governance, curriculum, legal structure, and institutional
  architecture, kept under version control.

# Jekyll's built-in default theme — this was already in effect implicitly;
# made explicit here so the color override in assets/css/style.scss works.
theme: minima

# Without this, minima's header auto-lists EVERY page on the site as top
# navigation (since every converted document has an H1, and GitHub Pages'
# bundled jekyll-titles-from-headings plugin gives every one of them a
# title even without front matter) — that's the giant wall of links
# appearing above real content on every page. Empty list = no auto-nav.
# To hand-pick a few links instead, replace [] with a real list, e.g.:
#   header_pages:
#     - curriculum/index.md
#     - governance/index.md
header_pages: []

# Alternative option: swap the line above for one of GitHub's supported
# Pages themes instead, and commit — no HTML changes needed anywhere:
#   jekyll-theme-cayman, jekyll-theme-minimal, jekyll-theme-slate,
#   jekyll-theme-architect, jekyll-theme-primer, jekyll-theme-tactile,
#   jekyll-theme-dinky, jekyll-theme-hacker, jekyll-theme-leap-day,
#   jekyll-theme-merlot, jekyll-theme-midnight, jekyll-theme-modernist,
#   jekyll-theme-time-machine
# (if you do this, the color override below will need different
# selectors — ask me and I'll update it for the specific theme.)
